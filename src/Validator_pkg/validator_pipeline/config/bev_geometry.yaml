frame_id: "base_link"

# Waypoint frame conversion is intentionally loaded from the inference-owned
# profile.json common T_base_from_lidar contract, not duplicated here.

# BEV 영상 크기
width: 600
height: 500

# 차량 좌표계 기준 범위 [m]
x_min: 0.0
x_max: 25.0
y_min: -15.0
y_max: 15.0

# 한 픽셀이 나타내는 실제 거리 [m/pixel]
resolution: 0.05

# 픽셀 축 정의
# row=0: 차량으로부터 가장 먼 전방
# col=0: 차량 좌측 끝
row_zero_is_x_max: true
col_zero_is_y_max: true
